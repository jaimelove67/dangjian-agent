# Alembic migration configuration
# NOTE: keep this file ASCII-only. Alembic reads it with the system locale
# encoding, so non-ASCII comments break `alembic` on Windows (GBK) hosts.

[alembic]
# Migration scripts location
script_location = migrations

# Add current working directory to sys.path so the `app` package is importable
prepend_sys_path = .

# Migration script file naming template
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Database URL (loaded from environment variables in migrations/env.py)
# sqlalchemy.url = driver://user:pass@localhost/dbname

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
