# 开发环境配置（仅用于参考，实际配置从环境变量读取）

# 此文件仅作为配置项的文档说明，不会被应用直接读取
# 实际配置通过 .env 文件或环境变量提供

database:
  url: postgresql+asyncpg://party_user:dev_password@localhost:5432/party_agent_dev
  pool_size: 20
  max_overflow: 10
  pool_recycle: 3600

redis:
  url: redis://localhost:6379/0
  pool_size: 10
  cache_ttl: 3600

logging:
  level: DEBUG
  format: json

security:
  secret_key: dev_secret_key_change_in_production
  enable_data_level_gateway: true
  allowed_external_models: []

models:
  qwen_api_key: sk-your-api-key-here
  embedding_model_path: /models/bge-large-zh-v1.5
  reranker_model_path: /models/bge-reranker-large

retrieval:
  top_k: 10
  rerank_top_k: 5
  no_evidence_threshold: 0.5
  exclude_expired_by_default: true

business:
  activist_training_days: 365
  probationary_period_days: 365
