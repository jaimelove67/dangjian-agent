server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /run/tls/fullchain.pem;
    ssl_certificate_key /run/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    # 附件上限 10MB，multipart 另有边界开销，留出余量
    client_max_body_size 12m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # 不记录URL参数、令牌、人员正文；持久访问审计由应用处理。
    access_log off;
    error_log /dev/stderr warn;
    root /usr/share/nginx/html;
    location /api/v1/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 150s;
    }
    location /api/ {
        proxy_pass http://app:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 150s;
    }
    # 带指纹的静态资源长期缓存；index.html 不缓存，避免部署后仍用旧 bundle
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
