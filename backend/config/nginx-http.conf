# 党建工作智能体 - 单机简化版前端 Nginx 配置（HTTP:80）
#
# 用途：腾讯云免费试用（2核2G）公网 IP 直连访问，无需 TLS 证书与备案。
# 正式上线应改用 config/nginx-production.conf（HTTPS 8443 + 反向代理）。
#
# 安全提示：HTTP 明文部署用于功能验证；正式环境必须启用 HTTPS。
# 与 production 版一致，不记录 URL 参数、令牌与人名正文；持久审计由应用处理。
server {
    listen 80;
    server_name _;
    server_tokens off;
    # 附件上限 10MB，multipart 还有边界与表头开销，留一点余量：
    # 正好 10MB 的文件不应在 nginx 层就被 413 拦下。
    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # 不记录URL参数、令牌、人员正文；持久访问审计由应用处理。
    access_log off;
    error_log /dev/stderr warn;
    root /usr/share/nginx/html;

    location /api/v1/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_http_version 1.1;
        proxy_buffering off;
        # 扫描件逐页 OCR 需要时间；60s 会把"正在识别"的长请求截断成 504。
        # 与前端 120s 超时、应用层 OCR_TIMEOUT_SECONDS 留出余量。
        proxy_read_timeout 150s;
    }
    location /api/ {
        proxy_pass http://app:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 150s;
    }
    # 带内容指纹的静态资源可长期缓存；
    # index.html 必须 no-store，否则部署后浏览器仍加载旧 bundle，用户看到"没更新"。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}