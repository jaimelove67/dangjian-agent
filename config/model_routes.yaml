# 模型路由配置
# 根据数据级别和任务类型选择合适的模型

# 数据级别定义
# - public: 公开数据
# - internal: 内部数据
# - sensitive: 敏感数据
# - classified: 涉密数据

# 模型路由规则
routes:
  # 公开数据 - 可使用外部模型
  - data_level: public
    task_type: qa
    model:
      provider: qwen
      name: qwen-turbo
      is_private: false
      max_tokens: 2000
      temperature: 0.3

  # 内部数据 - 优先私有模型
  - data_level: internal
    task_type: qa
    model:
      provider: local
      name: qwen2-7b-instruct
      is_private: true
      max_tokens: 2000
      temperature: 0.3

  # 敏感数据 - 强制私有模型
  - data_level: sensitive
    task_type: qa
    model:
      provider: local
      name: qwen2-7b-instruct
      is_private: true
      max_tokens: 2000
      temperature: 0.1

  - data_level: sensitive
    task_type: member_analysis
    model:
      provider: local
      name: qwen2-7b-instruct
      is_private: true
      max_tokens: 3000
      temperature: 0.1

  # 涉密数据 - 强制私有模型，不允许调用
  - data_level: classified
    task_type: "*"
    model:
      provider: local
      name: qwen2-7b-instruct
      is_private: true
      max_tokens: 2000
      temperature: 0.0

# 默认路由（找不到匹配规则时使用）
default:
  model:
    provider: local
    name: qwen2-7b-instruct
    is_private: true
    max_tokens: 2000
    temperature: 0.3

# 模型提供商配置
providers:
  qwen:
    type: api
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: QWEN_API_KEY
    models:
      - qwen-turbo
      - qwen-plus
      - qwen-max

  local:
    type: local
    base_url: http://localhost:8000/v1
    models:
      - qwen2-7b-instruct
      - qwen2-14b-instruct
