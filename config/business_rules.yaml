# 业务规则配置

# 党员发展阶段时限（天）
member_development:
  # 入党积极分子培养期
  activist_training_days: 365
  activist_training_min_days: 365

  # 发展对象培训期
  candidate_training_days: 90

  # 预备党员预备期
  probationary_period_days: 365
  probationary_period_min_days: 365

  # 提醒提前量（天）
  reminder_advance_days: 30

# 材料要求配置
material_requirements:
  # 入党申请人 -> 入党积极分子
  applicant_to_activist:
    - 入党申请书
    - 党组织谈话记录

  # 入党积极分子 -> 发展对象
  activist_to_candidate:
    - 思想汇报
    - 培养考察记录
    - 群众评议材料
    - 党课培训证明

  # 发展对象 -> 预备党员
  candidate_to_probationary:
    - 政治审查材料
    - 公示情况报告
    - 支部大会决议
    - 上级审批意见

  # 预备党员 -> 正式党员
  probationary_to_member:
    - 转正申请书
    - 预备期考察记录
    - 支部大会决议

# 评分规则配置
scoring_rules:
  # 维度权重（可按租户覆盖）
  weights:
    theory_test: 0.2      # 理论测试成绩
    volunteer_service: 0.2 # 志愿服务时长
    academic: 0.2          # 学业表现
    public_review: 0.2     # 群众评议
    party_review: 0.2      # 党员意见

  # 硬性风险项（出现即标记）
  risk_items:
    - 挂科
    - 处分
    - 群众评议不满意率超过30%

# 提醒规则配置
reminder_rules:
  # 培养期满提醒
  training_period:
    enabled: true
    advance_days: 30
    recipients:
      - 培养联系人
      - 支部书记

  # 材料提交提醒
  material_submission:
    enabled: true
    advance_days: 15
    recipients:
      - 本人
      - 培养联系人

  # 会议讨论提醒
  meeting_discussion:
    enabled: true
    advance_days: 7
    recipients:
      - 支部书记

  # 转正提醒
  probationary_expiration:
    enabled: true
    advance_days: 30
    recipients:
      - 本人
      - 支部书记

# 考核指标配置
assessment_indicators:
  # 组织建设类
  organization:
    - code: ORG_001
      name: 支部设置规范率
      formula: 规范支部数 / 总支部数 * 100
      target: 100

  # 党员发展类
  development:
    - code: DEV_001
      name: 年度发展党员人数
      formula: 发展党员数
      target: 按计划

    - code: DEV_002
      name: 材料完整率
      formula: 材料齐全人数 / 总人数 * 100
      target: 100

  # 组织生活类
  organization_life:
    - code: LIFE_001
      name: 三会一课完成率
      formula: 实际次数 / 要求次数 * 100
      target: 100

    - code: LIFE_002
      name: 会议记录完整率
      formula: 有记录会议数 / 总会议数 * 100
      target: 100

# 组织生活（三会一课）周期频次与应办事项提示（模块3）
# 频次按**周期**（month / quarter）表达，年度要求由周期派生：同一件事只写一份，
# 不出现"每月 1 次"与"每年 12 次"两处并存而互相矛盾的口径。
# 依据《中国共产党支部工作条例（试行）》：支部党员大会、党课一般每季度至少 1 次；
# 党支部委员会会议、党小组会一般每月 1 次。学校如需加严，改这里即可。
# 仅作为工作台提示与考核参照，不由模型自行认定"完成"；
# 完成认定以人工审核通过的会议记录为准。
activity_requirements:
  branch_member_meeting:      # 支部大会
    period: quarter
    per_period: 1
    basis: 支部党员大会一般每季度召开 1 次
  branch_committee_meeting:   # 支委会
    period: month
    per_period: 1
    basis: 党支部委员会会议一般每月召开 1 次
  party_group_meeting:        # 党小组会
    period: month
    per_period: 1
    basis: 党小组会一般每月召开 1 次（未划分党小组的支部不适用）
  party_lecture:              # 党课
    period: quarter
    per_period: 1
    basis: 党支部一般每季度至少组织 1 次党课
  other:                      # 其他组织生活
    period: none
    per_period: 0
    basis: 其他组织生活不设固定频次
