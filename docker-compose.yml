# 生产模板：只公开HTTPS；数据库与Redis使用学校配置的TLS服务。
# 未提供密钥、证书与明确来源时拒绝展开。真实学校审批仍由治理页面配置。
name: party-agent-production
x-runtime: &runtime
  image: party-agent:${APP_VERSION:-module6}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      BASE_IMAGE: ${BASE_IMAGE:-python:3.11-slim-bookworm}
  environment: &runtime-env
    ENV: production
    DEBUG: "false"
    LOG_FORMAT: json
    DATABASE_URL_FILE: /run/secrets/runtime_database
    REDIS_URL_FILE: /run/secrets/redis_url
    SECRET_KEY_FILE: /run/secrets/jwt_key
    FILE_ENCRYPTION_KEYS_FILE: /run/secrets/file_keys
    FILE_ENCRYPTION_ACTIVE_KEY: ${FILE_ENCRYPTION_ACTIVE_KEY:?待配置当前文件密钥版本}
    DASHSCOPE_API_KEY_FILE: /run/secrets/model_key
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:?待配置明确的学校HTTPS来源JSON数组}
    ALLOWED_EXTERNAL_MODELS: ${ALLOWED_EXTERNAL_MODELS:-[]}
    ALLOWED_LOCAL_MODEL_HOSTS: ${ALLOWED_LOCAL_MODEL_HOSTS:-[]}
    DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com}
    CHAT_MODEL: ${CHAT_MODEL:-qwen3.8-flash}
    EMBED_MODEL: ${EMBED_MODEL:-qwen3.7-text-embedding-flash}
    RERANK_MODEL: ${RERANK_MODEL:-qwen3.7-text-rerank}
    FILE_STORAGE_DIR: /app/uploads
    AUDIT_SPOOL_DIR: /app/audit-spool
    JOB_WORKER_ENABLED: "true"
  secrets: [runtime_database, redis_url, jwt_key, file_keys, model_key]
  read_only: true
  tmpfs: ["/tmp:uid=1000,gid=1000,mode=700"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  volumes:
    - originals:/app/uploads
    - audit_spool:/app/audit-spool
  networks: [backend, egress]

services:
  app:
    <<: *runtime
    restart: unless-stopped
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports: ["443:8443"]
    volumes:
      - ${TLS_CERT_DIR:?待配置学校TLS证书目录}:/run/tls:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=700
      - /var/run:uid=101,gid=101,mode=700
      - /tmp:uid=101,gid=101,mode=700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
    networks: [backend, edge]
  migrate:
    <<: *runtime
    profiles: [maintenance]
    environment:
      <<: *runtime-env
      DATABASE_URL_FILE: /run/secrets/migration_database
      JOB_WORKER_ENABLED: "false"
    secrets: [migration_database, redis_url, jwt_key, file_keys, model_key]
    command: [alembic, upgrade, head]

secrets:
  runtime_database:
    file: ${RUNTIME_DATABASE_FILE:?待配置非所有者运行账号TLS数据库URL文件}
  migration_database:
    file: ${MIGRATION_DATABASE_FILE:?待配置独立迁移账号TLS数据库URL文件}
  redis_url:
    file: ${REDIS_URL_FILE:?待配置rediss连接文件}
  jwt_key:
    file: ${JWT_KEY_FILE:?待配置独立JWT密钥文件}
  file_keys:
    file: ${FILE_KEYS_FILE:?待配置文件加密密钥环JSON文件}
  model_key:
    file: ${MODEL_KEY_FILE:?待配置模型密钥文件，未批准时可为空}

volumes:
  originals:
  audit_spool:
networks:
  backend:
    internal: true
  egress:
  edge:
