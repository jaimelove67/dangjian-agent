# 党建工作智能体 - Docker Compose 配置
version: '3.8'

services:
  # PostgreSQL 数据库（业务数据 + 向量库）
  postgres:
    image: pgvector/pgvector:pg16
    container_name: party-agent-postgres
    environment:
      POSTGRES_DB: party_agent
      POSTGRES_USER: party_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U party_user -d party_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - party-agent-network

  # Redis（缓存 + 队列）
  redis:
    image: redis:7-alpine
    container_name: party-agent-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-change_me_in_production}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - party-agent-network

  # 应用服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: party-agent-app
    environment:
      # 数据库配置
      DATABASE_URL: postgresql://party_user:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/party_agent
      # Redis 配置
      REDIS_URL: redis://:${REDIS_PASSWORD:-change_me_in_production}@redis:6379/0
      # 应用配置
      ENV: production
      LOG_LEVEL: INFO
      # 模型配置（从环境变量读取）
      QWEN_API_KEY: ${QWEN_API_KEY}
      EMBEDDING_MODEL_PATH: ${EMBEDDING_MODEL_PATH:-/models/bge-large-zh-v1.5}
      # 安全配置
      SECRET_KEY: ${SECRET_KEY:-please_change_this_secret_key}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
    volumes:
      # 挂载模型目录（本地模型）
      - ${LOCAL_MODEL_PATH:-./models}:/models:ro
      # 挂载配置文件
      - ./config:/app/config:ro
      # 挂载日志目录
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - party-agent-network

  # 本地向量化服务（可选，使用本地 Embedding 模型）
  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.2
    container_name: party-agent-embedding
    command: --model-id /models/bge-large-zh-v1.5 --port 8080
    volumes:
      - ${LOCAL_MODEL_PATH:-./models}:/models:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - party-agent-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  party-agent-network:
    driver: bridge
