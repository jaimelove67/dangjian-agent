# 党建工作智能体 - 开发环境 Docker Compose 配置
#
# 镜像源说明：同 docker-compose.yml，可通过 .env 中的
#   DOCKERHUB_MIRROR / GHCR_MIRROR 覆盖，默认值等价于原配置。
version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: ${DOCKERHUB_MIRROR:-docker.io}/pgvector/pgvector:pg16
    container_name: party-agent-postgres-dev
    environment:
      POSTGRES_DB: party_agent_dev
      POSTGRES_USER: party_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U party_user -d party_agent_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - party-agent-dev-network

  # Redis
  redis:
    image: ${DOCKERHUB_MIRROR:-docker.io}/library/redis:7-alpine
    container_name: party-agent-redis-dev
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - party-agent-dev-network

  # 应用服务（开发模式，热重载）
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        BASE_IMAGE: ${DOCKERHUB_MIRROR:-docker.io}/library/python:3.11-slim
    container_name: party-agent-app-dev
    environment:
      DATABASE_URL: postgresql://party_user:dev_password@postgres:5432/party_agent_dev
      REDIS_URL: redis://redis:6379/0
      ENV: development
      LOG_LEVEL: DEBUG
      # 开发环境使用的模型配置
      QWEN_API_KEY: ${QWEN_API_KEY}
      EMBEDDING_MODEL_PATH: /models/bge-large-zh-v1.5
      SECRET_KEY: dev_secret_key_change_in_production
    volumes:
      # 挂载源代码（热重载）
      - ./app:/app/app
      - ./tests:/app/tests
      - ./migrations:/app/migrations
      - ./config:/app/config
      - ./scripts:/app/scripts
      # 挂载模型目录
      - ${LOCAL_MODEL_PATH:-./models}:/models:ro
      # 挂载日志目录
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true
    networks:
      - party-agent-dev-network

  # pgAdmin（数据库管理工具）
  pgadmin:
    image: ${DOCKERHUB_MIRROR:-docker.io}/dpage/pgadmin4:latest
    container_name: party-agent-pgadmin-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@party-agent.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_dev_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - party-agent-dev-network

  # Redis Commander（Redis 管理工具）
  redis-commander:
    image: ${DOCKERHUB_MIRROR:-docker.io}/rediscommander/redis-commander:latest
    container_name: party-agent-redis-commander-dev
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - party-agent-dev-network

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  pgadmin_dev_data:
    driver: local

networks:
  party-agent-dev-network:
    driver: bridge
