# 党建工作智能体 - 单机简化版 Docker Compose
#
# 用途：腾讯云免费试用（2核2G）快速跑通验证。
# 依据 docker-compose.dev.yml 精简：去掉 pgAdmin / Redis Commander / 热重载，
# 前端改为 HTTP:80（新增 config/nginx-http.conf 与 Dockerfile.frontend.http）。
#
# 使用：
#   1. cp deploy/server/env.example .env 并填写实际值
#   2. docker compose -f docker-compose.server.yml up -d --build
#   3. docker compose -f docker-compose.server.yml exec app python -m alembic upgrade head
#
# 说明：
#   - 该编排面向 development/试用场景；ENV=production 会强制要求 DB/Redis 走 TLS，
#     正式上线请改用生产模板 docker-compose.yml 并完成 TLS 与密钥配置。
#   - 镜像源可通过 .env 的 DOCKERHUB_MIRROR 覆盖（默认 docker.io）。
#   - JOB_WORKER_ENABLED 默认 false：关闭 Celery worker 以适配 2G 内存。
name: party-agent-server

services:
  # ==================== PostgreSQL（pgvector） ====================
  postgres:
    image: ${DOCKERHUB_MIRROR:-docker.io}/pgvector/pgvector:pg16
    container_name: party-agent-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-party_agent}
      POSTGRES_USER: ${POSTGRES_USER:-party_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?需要在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"   # 2G 内存瘦身
      - "-c"
      - "work_mem=4MB"           # 2G 内存瘦身
      - "-c"
      - "effective_cache_size=384MB"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-party_user} -d ${POSTGRES_DB:-party_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==================== Redis ====================
  redis:
    image: ${DOCKERHUB_MIRROR:-docker.io}/library/redis:7-alpine
    container_name: party-agent-redis
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "96mb"          # 2G 内存瘦身
      - "--maxmemory-policy"
      - "allkeys-lru"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==================== 后端应用 ====================
  # 使用生产 Dockerfile（哈希锁定依赖、非 root 运行、无热重载）。
  # module6_entrypoint.py 支持直接从环境变量读取，无需 secrets 文件。
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${DOCKERHUB_MIRROR:-docker.io}/library/python:3.11-slim
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: party-agent-app
    environment:
      ENV: ${ENV:-development}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # 数据库 / Redis：容器内主机名直连（明文；ENV=production 时会被配置校验拒绝）
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-party_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-party_agent}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?需要在 .env 中设置 SECRET_KEY（至少32字符，勿用 dev_ 前缀）}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-["*"]}
      # 模型（百炼云端接入）
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-${QWEN_API_KEY:-}}
      CHAT_MODEL: ${CHAT_MODEL:-qwen3.8-flash}
      EMBED_MODEL: ${EMBED_MODEL:-qwen3.7-text-embedding-flash}
      RERANK_MODEL: ${RERANK_MODEL:-qwen3.7-text-rerank}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com}
      ALLOWED_EXTERNAL_MODELS: ${ALLOWED_EXTERNAL_MODELS:-["dashscope.aliyuncs.com"]}
      ALLOWED_LOCAL_MODEL_HOSTS: ${ALLOWED_LOCAL_MODEL_HOSTS:-[]}
      ENABLE_DATA_LEVEL_GATEWAY: "true"
      # 文件与审计（2G 瘦身：关闭 Celery worker）
      FILE_STORAGE_DIR: /app/uploads
      AUDIT_SPOOL_DIR: /app/audit-spool
      JOB_WORKER_ENABLED: ${JOB_WORKER_ENABLED:-false}
      ASSESSMENT_REMINDER_SCAN_SECONDS: ${ASSESSMENT_REMINDER_SCAN_SECONDS:-300}
      MEMBER_REMINDER_SCAN_SECONDS: ${MEMBER_REMINDER_SCAN_SECONDS:-3600}
    volumes:
      - originals:/app/uploads
      - audit_spool:/app/audit-spool
    ports:
      - "127.0.0.1:8000:8000"   # 仅本机可访问，便于就绪检查；公网流量走前端 80 反向代理
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ==================== 前端（Nginx HTTP:80） ====================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.http
      args:
        NODE_IMAGE: ${DOCKERHUB_MIRROR:-docker.io}/library/node:24-alpine
        NGINX_IMAGE: ${DOCKERHUB_MIRROR:-docker.io}/library/nginx:1.28-alpine
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    container_name: party-agent-frontend
    ports:
      - "80:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  originals:
    driver: local
  audit_spool:
    driver: local